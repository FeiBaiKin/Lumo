name: Verify

# 可复用的验证工作流：CI 手动运行与 Release 都调用它，保证「发布前验证」与
# 「手动验证」是同一套作业、同一份提交，不存在两条会漂移的流水线。
#
# 触发方式只有 workflow_call：它不是一个入口，入口是 ci.yml 与 release.yml。
on:
  workflow_call:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.4"
  NODE_VERSION: "24"
  CGO_ENABLED: "0"

jobs:
  console:
    name: Console（lint / typecheck / build；test 已无用例）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: 安装依赖
        working-directory: console
        run: npm ci

      - name: Biome 检查
        working-directory: console
        run: npm run lint

      - name: 类型检查
        working-directory: console
        run: npm run typecheck

      # 用例已于 2026-09-15 清空，这一步靠 --passWithNoTests 零用例通过。
      # 留着它，是为了将来加回用例时不用重新接线。
      - name: 单元测试（当前无用例）
        working-directory: console
        run: npm run test

      - name: 构建
        working-directory: console
        run: npm run build

      # 供 build 作业复用，验证 go:embed 能嵌入真实产物。
      - name: 上传 Console 产物
        uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: internal/console/dist
          retention-days: 1

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 校验 go.mod 已整理
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    name: Go 测试（用例已于 2026-09-15 清空，本作业目前是空跑）
    runs-on: ubuntu-latest
    # 集成测试需要 PostgreSQL，且必须直连一个独立的测试库。
    # 本作业保留下来是为了将来加回用例时不用重新接线：现在它只会拉起库、
    # 跑一条没有任何用例的 go test，然后绿着退出。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # 库名含 test：原先拒绝非测试库的护栏已随 testsupport 一起删除，
          # 这里仍用测试库名，是为了恢复测试时不必再想起这件事。
          POSTGRES_DB: lumo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 库名含 test（独立测试库约定；护栏已删，见上）
      LUMO_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/lumo_test?sslmode=disable
      # -race 依赖 cgo，故在本作业覆盖全局的 CGO_ENABLED=0。
      # 交付二进制仍是纯静态（见 build 与 cross-build 作业）。
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 测试（无用例，空跑）
        run: go test -tags nodynamic -race -coverprofile=coverage.out ./...

  build:
    name: 构建（含嵌入 Console）
    runs-on: ubuntu-latest
    needs: console
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 取回 Console 产物
        uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: internal/console/dist

      - name: 构建
        run: go build -tags nodynamic -trimpath -ldflags="-s -w" -o lumo ./cmd/lumo

      - name: 冒烟检查
        run: ./lumo version

  cross-build:
    name: 交叉编译检查
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -tags nodynamic -trimpath -o /dev/null ./cmd/lumo
