name: Verify

# 可复用的验证工作流：CI（推送、PR 与手动运行）与 Release 都调用它，保证「发布前验证」与
# 「日常验证」是同一套作业、同一份提交，不存在两条会漂移的流水线。
#
# 触发方式只有 workflow_call：它不是一个入口，入口是 ci.yml 与 release.yml。
#
# Go 测试分两类：不连库的单元测试，和连 PostgreSQL 服务容器的集成测试（每个测试在
# 自己的临时 schema 里跑，库名必须含 test，经 LUMO_TEST_DSN 传入）。
# 暂不开 -race：它依赖 cgo，而当年卡住测试作业的 goose 竞态还没有在这套测试上重新验证过。
on:
  workflow_call:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.4"
  NODE_VERSION: "24"
  CGO_ENABLED: "0"

jobs:
  console:
    name: Console（lint / typecheck / build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: 安装依赖
        working-directory: console
        run: npm ci

      - name: Biome 检查
        working-directory: console
        run: npm run lint

      - name: 类型检查
        working-directory: console
        run: npm run typecheck

      - name: 构建
        working-directory: console
        run: npm run build

      # 供 build 作业复用，验证 go:embed 能嵌入真实产物。
      - name: 上传 Console 产物
        uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: internal/console/dist
          retention-days: 1

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 校验 go.mod 已整理
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    name: Go 测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lumo
          POSTGRES_PASSWORD: lumo
          POSTGRES_DB: lumo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumo -d lumo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LUMO_TEST_DSN: postgres://lumo:lumo@127.0.0.1:5432/lumo_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 单元与集成测试
        run: go test -tags nodynamic -count=1 ./...

  build:
    name: 构建（含嵌入 Console）
    runs-on: ubuntu-latest
    needs: console
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 取回 Console 产物
        uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: internal/console/dist

      - name: 构建
        run: go build -tags nodynamic -trimpath -ldflags="-s -w" -o lumo ./cmd/lumo

      - name: 冒烟检查
        run: ./lumo version

  cross-build:
    name: 交叉编译检查
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -tags nodynamic -trimpath -o /dev/null ./cmd/lumo
