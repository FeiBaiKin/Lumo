name: CI

# 入口工作流：手动触发，随后调用可复用的 verify.yml。
#
# 作业定义在 verify.yml 里，与 Release 共用同一套——发布前的验证因此不可能
# 比手动验证更宽松。需要恢复「推送与 PR 自动执行」时，在下面的 on 里加回
# push / pull_request 即可，作业本身不用动。
on:
  workflow_dispatch:

# 同一分支的新推送取消尚在运行的旧任务，节省额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
