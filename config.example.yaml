# Lumo 配置示例
#
# 复制为 config.yaml 后按需修改。所有项都可被 LUMO_* 环境变量覆盖，
# 优先级：内置默认值 < config.yaml < 环境变量 < 命令行参数。
#
# 注意：数据库连接串**不在此文件中配置**，只接受环境变量 LUMO_DATABASE_DSN，
# 以避免口令进入版本库。例如：
#   LUMO_DATABASE_DSN=postgres://user:password@127.0.0.1:5432/lumo?sslmode=disable

server:
  # 监听地址（LUMO_ADDR）
  addr: ":8080"
  # 站点对外可访问地址，用于生成 canonical、sitemap 等绝对链接（LUMO_EXTERNAL_URL）
  externalUrl: ""
  readHeaderTimeout: 10s
  writeTimeout: 60s
  idleTimeout: 60s
  # 优雅关闭时留给在途请求的时间（LUMO_SHUTDOWN_TIMEOUT）
  shutdownTimeout: 15s

  # 可信反向代理的 CIDR 列表（LUMO_TRUSTED_PROXIES，逗号分隔）。
  #
  # 只有当直连对端属于这些网段时，X-Forwarded-For 才会被采信；
  # 否则一律使用直连地址。留空 = 不信任任何代理，这是最安全的默认值。
  # 反向代理与应用同机时填 127.0.0.0/8 即可。
  trustedProxies: []

  # 会话 Cookie 是否启用 Secure 属性（LUMO_SECURE_COOKIES）。
  #
  # 生产环境（HTTPS）必须为 true，此时还会启用 __Host- 前缀以抵御子域 Cookie 注入。
  # 本地 HTTP 开发必须为 false，否则浏览器不会保存 Cookie，登录会「成功但立刻失效」。
  secureCookies: false

  # 请求体上限，单位字节。
  #
  # maxBodySize 管普通请求（LUMO_MAX_BODY_SIZE），maxUploadSize 管 multipart 上传
  # （LUMO_MAX_UPLOAD_SIZE）。分开设是因为二者取舍相反：JSON 接口越小越安全，
  # 而附件动辄几十兆，用同一个值要么挡住正常上传，要么给所有接口开大口子。
  maxBodySize: 10485760      # 10 MiB
  maxUploadSize: 67108864    # 64 MiB

database:
  # 连接池上限（LUMO_DATABASE_MAX_OPEN_CONNS）
  maxOpenConns: 25
  # 空闲连接数，不得大于 maxOpenConns（LUMO_DATABASE_MAX_IDLE_CONNS）
  maxIdleConns: 5
  connMaxLifetime: 1h
  # 启动时自动执行迁移；也可用 --no-migrate 关闭（LUMO_DATABASE_AUTO_MIGRATE）
  autoMigrate: true

log:
  # debug / info / warn / error（LUMO_LOG_LEVEL）
  level: info
  # text / json（LUMO_LOG_FORMAT）。只作用于控制台那一路；
  # 写进文件的一律是 JSON，后台日志页要按字段解析。
  format: text
  # 除控制台外再写一份到 dataDir/logs，后台「日志」页读的就是它（LUMO_LOG_FILE）。
  # 关掉之后日志页会是空的，但 docker logs 与 journalctl 不受影响。
  file: true
  # 日志文件保留天数，超期的在跨天时删除（LUMO_LOG_RETAIN_DAYS）
  retainDays: 14
  # 单个日志文件的大小上限，超过则在同一天内滚到下一个序号（LUMO_LOG_MAX_SIZE_MB）
  maxSizeMB: 100

# 在线升级：后台「关于」页的检查与安装。
#
# 它会替换掉正在运行的这份二进制，所以只在「换掉的文件不会消失」时可用。
# 程序启动时自己判断：看二进制归哪个挂载点管——落在宿主机挂进来的目录或卷上
# 就是持久的，落在容器自己的根文件系统（overlay）上就不是。
#
# 于是「在容器里」并不等于不能升级：1Panel 的运行环境、宝塔的 Go 项目管理器
# 都是容器，但站点目录从宿主机挂进来，二进制躺在宿主机磁盘上，重建容器也不丢——
# 这类部署开箱可用。二进制打进镜像的那种（官方 Docker 镜像）才会被拒绝。
# 程序目录不可写也一样拒绝。两种情况后台都会把原因写在按钮旁边。
update:
  # 总开关（LUMO_UPDATE_ENABLED）。由发行方统一升级的部署（编排平台、包管理器）
  # 应当关掉它，关掉后不做后台检查，接口一律 409。
  enabled: true
  # 后台定期检查新版本（LUMO_UPDATE_AUTO_CHECK）。关掉仍可在后台手动检查。
  autoCheck: true
  # 检查间隔，最短 1 小时（LUMO_UPDATE_CHECK_INTERVAL）。
  # GitHub 对未认证请求按 IP 限 60 次/小时，同一出口下的多个站点会一起被限流。
  checkInterval: 24h
  # 是否把预发布版本也算作升级目标（LUMO_UPDATE_PRERELEASE）
  prerelease: false
  # 允许在「程序文件会随容器消失」的情况下仍然就地升级
  # （LUMO_UPDATE_ALLOW_IN_CONTAINER）。默认关闭。
  #
  # 只对二进制打在镜像层里的部署有意义。那种情况下换掉的文件活在容器的可写层：
  # docker restart 不会丢，但**重建**容器（改配置、拉新镜像、
  # compose up --force-recreate）会回到镜像里的版本——而几个月后没人会把
  # 「我那天改过端口」和「版本怎么退回去了」联系起来。
  #
  # 开着它换来的是：配一次，之后每次都能在后台一键升级，不必去换镜像标签。
  # 真退回去时，启动日志会记一条 warn，后台「关于」页也会明说，不会无声无息。
  #
  # 它推翻不了「程序目录只读」——那是物理事实，不是策略。官方 Docker 镜像里
  # 二进制在 / 下、进程是 nonroot，开了这个开关也写不进去，那边只能换镜像标签。
  allowInContainer: false
  # 容器部署的镜像地址（LUMO_UPDATE_IMAGE）。只用于在后台显示「该换成哪个标签」，
  # 程序不会自己去拉镜像。
  image: ghcr.io/feibaikin/lumo
  # 更新源仓库（LUMO_UPDATE_REPO）。改它等于改「这台机器信任谁发布的二进制」，
  # fork 与内网镜像按需修改。
  repo: FeiBaiKin/Lumo
  # 升级成功后保留的旧版本备份份数，0 表示不自动清理（LUMO_UPDATE_KEEP_BACKUPS）。
  # 备份放在 dataDir/backups，后台可以逐份删除。
  keepBackups: 3

# 更新源的两项凭据与地址只走环境变量，不写在此文件里：
#   LUMO_UPDATE_TOKEN     GitHub 令牌，用于抬高限流阈值；公开仓库不需要
#   LUMO_UPDATE_API_BASE  API 根地址，指向自建镜像或 GitHub Enterprise 时才设

# 运行时工作目录，内含 themes/uploads/cache/logs/backups（LUMO_DATA_DIR）
dataDir: ./data

# 附件存储位置在后台「设置 → 附件存储」中配置，不写在此文件里。
# 选择 S3 兼容存储时，访问密钥也在那一页上填，加密后存进数据库；
# 环境变量是兜底，后台没填时生效：
#   LUMO_S3_ACCESS_KEY=...
#   LUMO_S3_SECRET_KEY=...
#
# 主密钥（加密口令字段用）默认生成在 dataDir/secret.key。多实例部署若各自
# 只有本地磁盘，必须显式指定同一个密钥，否则各生成一把、互相解不开：
#   LUMO_SECRET_KEY=<openssl rand -base64 32 的输出>
