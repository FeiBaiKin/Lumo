{{ template "layouts/base.html" . }}

{{ define "main" }}
{{ $post := .Post }}

{{- /* 独立页面不显示日期与分类：关于页、联系页上的「三年前发表」只会让人误解。 */ -}}
<div class="wrap">
  <article class="article page">
    <header class="article-header">
      <h1 class="article-title">{{ $post.Title }}</h1>
    </header>

    <div class="prose">{{ safeHTML $post.Content }}</div>
  </article>

  {{ if .Theme.Settings.content.showComments }}
  {{ template "partials/comments.html" . }}
  {{ end }}
</div>
{{ end }}
