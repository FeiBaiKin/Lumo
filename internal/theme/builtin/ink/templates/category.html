{{ template "layouts/base.html" . }}

{{ define "main" }}
<div class="wrap">
  <header class="archive-header">
    <p class="archive-kind">分类</p>
    <h1 class="archive-title">{{ .Category.Name }}</h1>
    {{ with .Category.Description }}<p class="archive-desc">{{ . }}</p>{{ end }}
    <p class="archive-count">共 {{ .Pagination.Total }} 篇</p>
  </header>

  {{ template "partials/post-list.html" . }}
</div>
{{ end }}
